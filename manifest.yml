application:
  subdomain: netbird
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: file:///lzcapp/pkg/content/
services:
  netbird:
    # netbirdio/netbird:0.59.5
    # upstream: docker.io/netbirdio/netbird:0.82.0
    image: registry.lazycat.cloud/czyt/netbirdio/netbird:0b13864f5c09e0a6
    environment:
      - NB_SETUP_KEY={{.U.nb_setup_key}}
    binds:
      - /lzcapp/var/netbird:/var/lib/netbird
    network_mode: host
