application:
  subdomain: netbird
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: file:///lzcapp/pkg/content/
services:
  netbird:
    # netbirdio/netbird:0.59.5
    # upstream: docker.io/netbirdio/netbird:0.82.1
    image: registry.lazycat.cloud/czyt/netbirdio/netbird:a5cf08163801114e
    environment:
      - NB_SETUP_KEY={{.U.nb_setup_key}}
    binds:
      - /lzcapp/var/netbird:/var/lib/netbird
    network_mode: host
